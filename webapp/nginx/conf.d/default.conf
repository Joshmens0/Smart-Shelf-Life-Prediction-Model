# ══════════════════════════════════════════════════════════════════
# Smart Shelf Life Predictor — Production Nginx Gateway Configuration
# Uses Docker runtime DNS resolver to prevent startup host-resolution crashes.
# ══════════════════════════════════════════════════════════════════

# Docker internal embedded DNS resolver
resolver 127.0.0.11 valid=10s ipv6=off;

# ── HTTP Server (Proxy & Let's Encrypt ACME Challenge) ──
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME-challenge for Certbot automated SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Dynamic upstream variables (resolves at request time, prevents startup crash)
    set $frontend_upstream "http://frontend:80";
    set $backend_upstream "http://backend:8000";

    # Default HTTP proxy to frontend SPA
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy for HTTP mode
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        client_max_body_size 25M;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Uploads serving proxy for HTTP mode
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}

# ── HTTPS Server (Production with TLS) ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Dynamic upstream variables (resolves at request time, prevents startup crash)
    set $frontend_upstream "http://frontend:80";
    set $backend_upstream "http://backend:8000";

    # SSL Certificates (Managed via Certbot or self-signed fallback)
    ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

    # SSL Protocols and Ciphers (Mozilla Modern Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers (Per Universal App Template Standards)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Maximum file upload size for fruit images (25 Megabytes)
    client_max_body_size 25M;

    # ── Frontend Static SPA Proxy ──
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend API Endpoints ──
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Longer timeouts for CNN-MLP inference requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # ── Auth Endpoints with Stricter Rate Limiting ──
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # ── Static Uploads Proxy ──
    location /uploads/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
