name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r webapp/backend/requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Run Ruff Linter
        run: |
          ruff check webapp/backend/src

      - name: Run Pytest Suite
        run: |
          pytest webapp/backend/test -v

  test-frontend:
    name: Frontend Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: webapp/frontend/package.json

      - name: Install Dependencies
        run: |
          cd webapp/frontend
          npm ci || npm install

      - name: Validate TypeScript Compilation
        run: |
          cd webapp/frontend
          npx tsc --noEmit

      - name: Build Production Assets
        run: |
          cd webapp/frontend
          npm run build

  validate-docker:
    name: Validate Container Configurations
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Syntax
        run: |
          docker compose config -q
